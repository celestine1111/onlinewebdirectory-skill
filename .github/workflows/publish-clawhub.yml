name: Publish skill to ClawHub

on:
  push:
    branches: [main]
    paths: ["skills/**"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the skill client parses
        run: node --check skills/onlinewebdirectory/owd.mjs
      - name: Publish
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::warning::CLAWHUB_TOKEN secret is not set; skipping the ClawHub publish."
            exit 0
          fi
          npx --yes clawhub@latest login --token "$CLAWHUB_TOKEN"
          npx --yes clawhub@latest skill publish ./skills/onlinewebdirectory \
            --slug onlinewebdirectory \
            --name "Online Web Directory" \
            --changelog "$(git log -1 --pretty=%s)"
